name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  ci:
    name: Lint · Test · Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint (src + functions)
        run: npx eslint src/ functions/

      - name: Test (vitest)
        run: npm test -- --reporter=verbose

      - name: Build (vite)
        run: npm run build

      - name: Cloud Functions syntax check
        run: node --check functions/index.js
